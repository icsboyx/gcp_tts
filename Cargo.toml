[package]
name = "gcp_tts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal async client for the Google Cloud Text-to-Speech REST API"

[lib]
name = "gcp_tts"


[dependencies]
base64 = "0.23.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[dev-dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
